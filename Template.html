    <style>
      /* By Abdullah As-Sadeed */

      :root {
        --crust: #11111b;
        --mantle: #181825;
        --base: #1e1e2e;
        --surface0: #313244;
        --surface1: #45475a;
        --surface2: #585b70;
        --overlay0: #6c7086;
        --overlay1: #7f849c;
        --overlay2: #9399b2;
        --subtext0: #a6adc8;
        --subtext1: #bac2de;
        --text: #cdd6f4;
        --lavender: #b4befe;
      }

      * {
        box-sizing: border-box;
        outline: none;
        scroll-behavior: smooth;
      }

      html,
      body {
        margin: 0rem;
        height: 100%;
        padding: 0rem;
      }

      body {
        display: flex;
        background-color: var(--base);
        flex-direction: row;
        line-height: 1.5;
        font-family: system-ui, sans-serif;
        color: var(--text);
      }

      main {
        flex: 1;
        height: 100vh;
        border: 1px solid var(--surface0);
        overflow-y: scroll;
      }

      main header {
        border-bottom: 1px solid var(--surface0);
        background-color: var(--mantle);
        padding: 4rem 1rem 4rem 1rem;
        text-align: center;
        color: var(--text);
      }

      main header h1 {
        margin: 0rem;
        color: var(--lavender);
      }

      main header p {
        margin: 1rem;
        color: var(--text);
      }

      main article {
        margin: auto;
        padding: 1rem;
        columns: 16rem;
        column-gap: 1rem;
      }

      main article figure {
        margin: 0 0 1rem;
        display: inline-block;
        width: 100%;
        break-inside: avoid;
      }

      main article figure img {
        display: block;
        width: 100%;
        height: auto;
      }

      main article figure img:not(:fullscreen) {
        cursor: zoom-in;
      }

      main article figure img:fullscreen {
        object-fit: contain;
      }

      main footer {
        border-top: 1px solid var(--surface0);
        background-color: var(--mantle);
        padding: 4rem 1rem 4rem 1rem;
        text-align: center;
        color: var(--text);
      }

      main footer a {
        text-decoration: none;
        color: var(--text);
        cursor: pointer;
        transition: color 0.2s;
      }

      main footer a:hover,
      main footer a:focus {
        color: var(--lavender);
      }
    </style>
  </head>
  <body lang="en-US">
    <main>
      <header>
        <h1>Bitscoper Nature</h1>
        <p id="counts" />
      </header>
      <article />
      <footer>

        <br />
        <br />
        <a href="https://github.com/bitscoper/Bitscoper_Nature/" title="Source Code" target="_blank"> Source Code </a>
      </footer>
    </main>
    <script>
      /* By Abdullah As-Sadeed */

      "use strict";

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/Service_Worker.js");
      }

      window.onload = function() {
        document.querySelectorAll("main article figure img").forEach((imageElement) => {
          imageElement.onclick = async function() {
            try {
              if (imageElement.requestFullscreen) {
                await imageElement.requestFullscreen({
                  navigationUI: "hide",
                });
              }
            } catch (error) {
              console.error(error);
            }
          };
        });
      };
    </script>
  </body>
